name: File generation tests

on:
  push:
    branches: [main]
    paths:
      - "piper_pdf_router.py"
      - "test_file_generator.py"
      - "requirements.txt"
      - ".github/workflows/file-generation-tests.yml"
  pull_request:
    paths:
      - "piper_pdf_router.py"
      - "test_file_generator.py"
      - "requirements.txt"
      - ".github/workflows/file-generation-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install file-generation dependencies
        run: python -m pip install fastapi pydantic reportlab PyMuPDF python-docx openpyxl python-pptx
      - name: Run file-generation tests
        run: python -m unittest -v test_file_generator.py
